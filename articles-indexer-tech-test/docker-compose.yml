services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: articles-indexer-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_LOAD_DEFINITIONS_FILE: /etc/rabbitmq/definitions.json
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - articles-indexer-network

  articles-service:
    build:
      context: ./articles-service
      dockerfile: Dockerfile
    container_name: articles-indexer-articles-service
    ports:
      - "8081:8000"
    volumes:
      - ./articles-service:/var/www/html
      - articles_vendor:/var/www/html/vendor
      - articles_storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      RABBITMQ_EXCHANGE: articles.events
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - articles-indexer-network
    command: php artisan serve --host=0.0.0.0 --port=8000

  indexer-service:
    build:
      context: ./indexer-service
      dockerfile: Dockerfile
    container_name: articles-indexer-indexer-service
    volumes:
      - ./indexer-service:/var/www/html
      - indexer_vendor:/var/www/html/vendor
      - indexer_storage:/var/www/html/storage
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: /
      RABBITMQ_QUEUE: indexer.articles
      RABBITMQ_EXCHANGE: articles.events
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - articles-indexer-network
    # Consumer is started manually for testing
    # To start: docker compose exec indexer-service php artisan rabbitmq:consume-articles
    command: sleep infinity

volumes:
  rabbitmq_data:
  articles_storage:
  articles_vendor:
  indexer_storage:
  indexer_vendor:

networks:
  articles-indexer-network:
    driver: bridge